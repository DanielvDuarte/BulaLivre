<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BulaLivre — Consulta de Medicamentos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BulaLivre">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#f4f7f6; --surface:#fff; --surface2:#eef3f1; --line:#dbe5e1;
    --ink:#0f2420; --muted:#5a6b66; --brand:#0f766e; --brand2:#115e59; --brand-soft:#d7f0ec;
    --hero1:#0f766e; --hero2:#134e4a;
    --ok:#15803d; --ok-bg:#dcf5e4; --warn:#a16207; --warn-bg:#fdf0cc; --danger:#b91c1c; --danger-bg:#fde2e2;
    --shadow:0 1px 2px rgba(15,36,32,.06),0 4px 14px rgba(15,36,32,.06);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0c1311; --surface:#131d1a; --surface2:#1a2724; --line:#25342f;
      --ink:#e6f0ed; --muted:#8fa39d; --brand:#2dd4bf; --brand2:#5eead4; --brand-soft:#12332f;
      --hero1:#0f766e; --hero2:#0b3b38;
      --ok:#4ade80; --ok-bg:#12301e; --warn:#fbbf24; --warn-bg:#35290a; --danger:#f87171; --danger-bg:#3a1515;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit;cursor:pointer}
  svg{flex-shrink:0}

  /* ---------- topo ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .topbar .in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
  .logo{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:800;font-size:17px;letter-spacing:-.2px;white-space:nowrap}
  .logo:hover{text-decoration:none}
  .logo .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--hero1),#14b8a6);display:grid;place-items:center;color:#fff}
  .logo b{color:var(--brand)}
  .topsearch{flex:1;min-width:0;max-width:440px;margin-left:auto}
  .topbtns{display:flex;gap:6px}
  .ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
  .ibtn:hover{color:var(--brand);border-color:var(--brand)}
  .ibtn:disabled{opacity:.5;cursor:wait}
  body.home .topsearch{display:none}
  body.home .topbtns{margin-left:auto}

  /* ---------- campo de busca ---------- */
  .sbox{position:relative}
  .sfield{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:4px 6px 4px 12px;min-height:44px;color:var(--muted)}
  .sfield:focus-within{border-color:var(--brand);background:var(--surface)}
  .sfield input{flex:1;min-width:120px;border:0;background:transparent;outline:none;font:inherit;font-size:16px;color:var(--ink);height:34px}
  .sfield input::placeholder{color:var(--muted)}
  .sfield input::-webkit-search-cancel-button{display:none}
  .sgo{border:0;background:var(--brand);color:#fff;font-weight:600;font-size:14px;border-radius:9px;padding:0 16px;height:34px}
  .sc{display:inline-flex;align-items:center;gap:2px;background:var(--brand-soft);color:var(--brand2);border:1px solid var(--brand);border-radius:999px;padding:2px 3px 2px 11px;font-size:14px;font-weight:600;white-space:nowrap}
  .sc button{border:0;background:transparent;color:inherit;font-size:18px;line-height:1;width:22px;height:22px;border-radius:50%;padding:0}
  .sc button:hover{background:var(--brand);color:#fff}
  .hero .sc{color:#115e59;background:#d7f0ec}
  .symbox{margin:6px 0 14px}
  .symbox .sfield{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
  .cov{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);flex-shrink:0}
  .cov.full{background:var(--ok-bg);color:var(--ok)}
  .blk ul{margin:6px 0 0;padding-left:20px;font-size:15px}
  .blk li{margin:3px 0}
  .who{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--brand)}
  .muted{color:var(--muted)}
  .alert.info{background:var(--brand-soft);border-left-color:var(--brand);font-size:13px;color:var(--ink)}
  .sgo:hover{background:var(--brand2)}
  .sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:40;max-height:70vh;overflow:auto;display:none;text-align:left}
  .sug.open{display:block}
  .sug h6{margin:0;padding:10px 14px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .sug a{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;color:var(--ink);font-size:14.5px}
  .sug a:hover,.sug a.sel{background:var(--brand-soft);text-decoration:none}
  .sug a small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
  .sug .all{border-top:1px solid var(--line);color:var(--brand);font-weight:600;justify-content:center;margin-top:4px}

  /* ---------- layout ---------- */
  main{flex:1;width:100%;max-width:960px;margin:0 auto;padding:20px 16px 8px}
  body.home main{max-width:none;padding:0}
  .page{max-width:960px;margin:0 auto}

  /* ---------- home ---------- */
  .hero{background:radial-gradient(900px 300px at 85% -10%,rgba(255,255,255,.16),transparent 60%),
        radial-gradient(500px 260px at 0% 110%,rgba(20,184,166,.35),transparent 60%),
        linear-gradient(135deg,var(--hero1),var(--hero2));
        color:#fff;padding:48px 16px 64px;text-align:center;min-height:calc(100vh - 60px - env(safe-area-inset-top));display:flex;flex-direction:column;justify-content:center;align-items:center}
  .hero .sbox{width:100%}
  .explore{margin-top:22px;font-size:13px;opacity:.85}
  .explore a{color:#fff;text-decoration:underline;text-underline-offset:3px}
  .hero h1{margin:0 0 8px;font-size:clamp(28px,6vw,44px);letter-spacing:-1px;line-height:1.1}
  .hero p{margin:0 auto 26px;max-width:520px;opacity:.9;font-size:clamp(14px,3.4vw,17px)}
  .hero .sbox{max-width:620px;margin:0 auto}
  .hero .sfield{background:#fff;min-height:54px;border-radius:16px;padding-left:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);color:#5a6b66}
  .hero .sfield input{color:#0f2420}
  .hero .sgo{height:42px;padding:0 20px;border-radius:12px}

  /* ---------- resultados ---------- */
  h1.title{font-size:clamp(20px,4.5vw,26px);margin:2px 0 4px;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13.5px;font-weight:500}
  .tab:hover{text-decoration:none;border-color:var(--brand);color:var(--brand)}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .tab i{font-style:normal;opacity:.75;margin-left:4px;font-size:12px}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;align-items:center}
  .filters>span{font-size:12.5px;color:var(--muted);margin-right:2px}
  .chip{padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px}
  .chip:hover{text-decoration:none;border-color:var(--brand);color:var(--brand)}
  .chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
  .sec{margin:0 0 22px}
  .sec h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
  .sec h3 a{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
  .list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
  .item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);color:var(--ink)}
  .item:first-child{border-top:0}
  .item:hover{background:var(--brand-soft);text-decoration:none}
  .ico{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
  .item .tx{flex:1;min-width:0}
  .item .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis}
  .item .sb{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .go{color:var(--muted);flex-shrink:0}
  mark{background:#fde68a;color:#3b2f00;border-radius:3px;padding:0 1px}
  .tag{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:700;white-space:nowrap;flex-shrink:0}
  .t-mip{background:var(--ok-bg);color:var(--ok)}
  .t-presc{background:var(--warn-bg);color:var(--warn)}
  .t-ctrl{background:var(--danger-bg);color:var(--danger)}
  .t-na{background:var(--surface2);color:var(--muted)}
  .pager{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:18px 0 8px}
  .pager a,.pager span{min-width:38px;height:38px;padding:0 10px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px}
  .pager a:hover{text-decoration:none;border-color:var(--brand);color:var(--brand)}
  .pager .cur{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
  .pager .dis{opacity:.4}
  .pager .dots{border:0;background:transparent}
  .empty{text-align:center;color:var(--muted);padding:48px 10px}
  .empty b{color:var(--ink)}

  /* ---------- detalhe ---------- */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-bottom:12px;background:none;border:0;padding:4px 0}
  .back:hover{color:var(--brand)}
  .dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
  .dhead{display:flex;gap:14px;align-items:flex-start}
  .dhead .ico{width:52px;height:52px;border-radius:14px}
  .dhead h1{margin:0;font-size:clamp(22px,5vw,30px);letter-spacing:-.6px;line-height:1.15;word-break:break-word}
  .dhead .lab{margin-top:4px;font-size:15px}
  .dhead .tag{margin-top:8px;display:inline-block}
  .dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 24px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .dl dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 3px}
  .dl dd{margin:0;font-size:15px}
  .blk{margin-top:18px}
  .blk h2{margin:0 0 6px;font-size:16px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .blk p{margin:6px 0 0;font-size:15px}
  .alert{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;margin-top:18px;font-size:14.5px}
  .alert b{color:var(--warn)}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .links a{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:13.5px;font-weight:500}
  .links a:hover{text-decoration:none;background:var(--brand);color:#fff}
  .note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--muted);margin:18px 0}
  .tip{border-left-color:var(--brand);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
  .tip button{border:0;background:none;color:var(--brand);font-size:12.5px;white-space:nowrap;padding:0}

  footer{max-width:960px;width:100%;margin:0 auto;padding:14px 16px 34px;color:var(--muted);font-size:12px;text-align:center}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);
    padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{text-align:center;color:var(--muted);padding:60px 0}

  @media (max-width:560px){
    .hero{padding:40px 16px 80px}
    .logo span.t{display:none}
    body:not(.home) .logo span.t{display:none}
    .sgo{padding:0 12px}
    .item .tag{display:none}
    .dcard{padding:16px}
  }

  /* ---------- calculadora ---------- */
  a.ibtn{text-decoration:none}
  .calcbtn{margin-top:18px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px}
  .calcbtn:hover{background:rgba(255,255,255,.28);text-decoration:none}
  .calcbtn small{opacity:.8;font-weight:400}
  .btn{display:inline-block;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600}
  .btn:hover{border-color:var(--brand);color:var(--brand);text-decoration:none}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand2);color:#fff}
  .cg{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
  @media (min-width:900px){ .calc.page{max-width:1080px} .cg{grid-template-columns:minmax(0,1fr) 400px} .cout{position:sticky;top:76px} }
  .cx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .cx h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
  .cx h2 span{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center}
  .fl{display:block;font-size:12.5px;color:var(--muted);margin:0 0 10px;font-weight:500}
  .fl input,.fl select{display:block;width:100%;margin-top:4px;height:42px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font:inherit;font-size:16px;padding:0 10px;outline:none}
  .fl input:focus,.fl select:focus{border-color:var(--brand);background:var(--surface)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .inl{display:flex;gap:6px}.inl input{flex:1;min-width:0}.inl select{width:auto}
  .chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:2px 0 10px}
  .cuso{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
  details.opt{margin:2px 0 12px;font-size:14px}
  details.opt summary{cursor:pointer;color:var(--brand);font-weight:600;margin-bottom:8px}
  .cout .rx{background:var(--surface);border:1.5px solid var(--brand);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .rx.rx-bad{border-color:var(--danger)}
  .rx-h{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
  .rx-h small{text-transform:none;letter-spacing:0;font-weight:500;margin-left:6px}
  .rx-big{font-size:clamp(34px,8vw,46px);font-weight:800;color:var(--brand);letter-spacing:-1px;line-height:1.1;margin:6px 0 2px}
  .rx-big span{font-size:.45em;font-weight:700;letter-spacing:0}
  .rx-line{font-size:16px}
  .rx-sub{color:var(--muted);font-size:13.5px;margin:6px 0 12px}
  .rx-t{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}
  .rx-t td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
  .rx-t td:first-child{color:var(--muted);width:42%}
  .rx-t small,.al small{color:var(--muted)}
  .al{border-radius:10px;padding:8px 12px;font-size:13.5px;margin:6px 0;border-left:4px solid var(--line);background:var(--surface2)}
  .al-perigo{background:var(--danger-bg);border-left-color:var(--danger);color:var(--ink)}
  .al-aviso{background:var(--warn-bg);border-left-color:var(--warn);color:var(--ink)}
  .rx-btns{display:flex;gap:8px;margin-top:12px}
  .rx-btns .btn{cursor:pointer}
  .empty-rx p{color:var(--muted);margin:8px 0 0}
  .cin{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0;font-size:14px}
  .ph{margin:12px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand)}
  .ph:first-child{margin-top:4px}
  .cin dt{color:var(--muted)}.cin dd{margin:0}
  .print-only{display:none}
  .rx-mini{display:none}
  .topsearch .sfield{flex-wrap:nowrap}
  .topsearch .sfield input{min-width:0}
  @media (max-width:899px){
    .rx-mini{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:35;justify-content:space-between;align-items:center;gap:10px;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.3)}
    .rx-mini b{font-weight:500;font-size:13px;opacity:.9}
    .calc{padding-bottom:70px}
  }
  @media print{
    body{background:#fff;color:#000}
    .topbar,footer,.noprint,.note,#toast{display:none!important}
    .print-only{display:block!important}
    .cg{display:block}.cout{position:static}
    .cout .rx{box-shadow:none;border:1px solid #000}
    .rx-big{color:#000}
    main{padding:0}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="in">
    <a class="logo" href="#/" aria-label="BulaLivre — início">
      <span class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7Z"/><path d="m8.5 8.5 7 7"/></svg></span>
      <span class="t">Bula<b>Livre</b></span>
    </a>
    <div class="topsearch sbox" id="topSearch"></div>
    <div class="topbtns">
      <a class="ibtn" href="#/calculadora" title="Calculadora de dose (profissionais)" aria-label="Calculadora de dose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg>
      </a>
      <button class="ibtn" id="btnUpdate" title="Recarrega a base de dados mais recente publicada" aria-label="Atualizar base">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/><path d="M3 12A9 9 0 0 1 18.5 5.8L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button class="ibtn" id="btnDownload" title="Baixa uma cópia completa que funciona sem internet" aria-label="Baixar cópia offline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
    </div>
  </div>
</header>
<main id="app"><div class="loading">carregando base…</div></main>
<footer id="footer"></footer>
<div id="toast"></div>

<script>
/* === INÍCIO DADOS EMBUTIDOS — não edite a linha abaixo manualmente ===
   No modo online esta variável fica null e o app busca o arquivo bulas.json.
   Ao clicar em "Baixar offline", o app injeta a base inteira nesta linha,
   gerando um arquivo HTML autossuficiente que roda sem internet. */
let EMBEDDED_DATA = null; /*__EMBED_SLOT__*/

const OFFLINE = EMBEDDED_DATA !== null;
let DATA = {versao:"—", atualizado_em:"", fonte:"", total:0, produtos:[]};
const PAGE = 20;

/* ---------- utilidades ---------- */
const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
const esc = s => (s||"").toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const nf = n => n.toLocaleString("pt-BR");
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const TIPO = {mip:["Isento de prescrição","t-mip"], presc:["Sob prescrição","t-presc"], ctrl:["Controlado","t-ctrl"], "":["Não informado","t-na"]};
const ICON = {
  pill:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7Z"/><path d="m8.5 8.5 7 7"/></svg>',
  flask:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/></svg>',
  building:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 21v-5h6v5"/></svg>',
  heart:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 8L9 4l-3 8H2"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>'
};

function hl(text,q){
  const t=text||"";
  const nq=norm(q);
  if(!nq) return esc(t);
  const nt=norm(t), i=nt.indexOf(nq);
  if(i<0 || nt.length!==t.length) return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+nq.length))+"</mark>"+esc(t.slice(i+nq.length));
}

/* ---------- índices (produtos, substâncias, laboratórios, patologias) ---------- */
let PRODS=[], SUBS=[], LABS=[], PATS=[], BY_ID=new Map(), SUB_MAP=new Map(), LAB_MAP=new Map(), PAT_MAP=new Map();

function buildIndex(){
  PRODS = DATA.produtos||[];
  BY_ID.clear(); SUB_MAP.clear(); LAB_MAP.clear(); PAT_MAP.clear();
  const add=(map,name,p)=>{
    const k=norm(name); if(!k) return;
    let e=map.get(k); if(!e){ e={nome:cap(name.trim()),k,_h:k,prods:[]}; map.set(k,e); }
    e.prods.push(p);
  };
  PRODS.forEach(p=>{
    p._h = norm([p.nome,p.pa,p.laboratorio,p.classe,p.cat,(p.sintomas||[]).join(" ")].join(" | "));
    p._n = norm(p.nome);
    let id = slug(p.nome)+(p.laboratorio?"--"+slug(p.laboratorio).slice(0,24):"");
    if(BY_ID.has(id)){ let i=2; while(BY_ID.has(id+"-"+i)) i++; id+="-"+i; }
    p.id=id; BY_ID.set(id,p);
    p._subs = (p.pa||"").split(/\s*,\s*/).filter(Boolean);
    p._subs.forEach(s=>add(SUB_MAP,s,p));
    if(p.laboratorio) add(LAB_MAP,p.laboratorio,p);
    (p.sintomas||[]).forEach(s=>add(PAT_MAP,s,p));
  });
  const fin=m=>[...m.values()].sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:0);
  SUBS=fin(SUB_MAP); LABS=fin(LAB_MAP); PATS=fin(PAT_MAP);
}

function rank(list,q,key){
  // prefixo > contém; depois ordem alfabética
  const nq=norm(q);
  if(!nq) return list;
  return list.map(x=>{const n=key(x);return [n.startsWith(nq)?0:(n.split(/\s+/).some(w=>w.startsWith(nq))?1:2),x];})
             .sort((a,b)=>a[0]-b[0]||(key(a[1])<key(b[1])?-1:key(a[1])>key(b[1])?1:0)).map(x=>x[1]);
}
function searchProds(q,tipo,nameOnly){
  const words=norm(q).split(/\s+/).filter(Boolean);
  const list=PRODS.filter(p=>(!tipo||p.tipo===tipo) && words.every(w=>(nameOnly?p._n+" "+norm(p.pa):p._h).includes(w)));
  return rank(list,q,p=>p._n);
}
function searchAgg(arr,q){
  const words=norm(q).split(/\s+/).filter(Boolean);
  const list=arr.filter(e=>words.every(w=>e.k.includes(w)));
  return rank(list,q,e=>e.k);
}

/* ---------- roteador por hash ---------- */
function parseHash(){
  let h=location.hash.replace(/^#/,"")||"/";
  const [path,qs]=h.split("?");
  return {parts:path.split("/").filter(Boolean).map(decodeURIComponent), params:new URLSearchParams(qs||"")};
}
function href(path,params){
  const qs=new URLSearchParams();
  Object.entries(params||{}).forEach(([k,v])=>{ if(v!==undefined&&v!==null&&v!=="") qs.set(k,v); });
  const s=qs.toString();
  return "#/"+path+(s?"?"+s:"");
}
const hMed = p => "#/medicamento/"+encodeURIComponent(p.id);
const hList = (kind,name) => "#/lista/"+kind+"/"+encodeURIComponent(name);

let lastQ="";
function route(){
  const {parts,params}=parseHash();
  const app=$("app");
  const view=parts[0]||"";
  document.body.classList.toggle("home",view==="");
  window.scrollTo(0,0);
  if(!PRODS.length && !DATA.produtos.length){ return; }
  if(view===""){ app.innerHTML=viewHome(); document.title="BulaLivre — Consulta de Medicamentos"; }
  else if(view==="busca"){ app.innerHTML=viewSearch(params); }
  else if(view==="sintomas"){ app.innerHTML=viewSintomas(params); }
  else if(view==="calculadora"){ app.innerHTML=viewCalc(); }
  else if(view==="medicamento"){ app.innerHTML=viewDetail(parts[1]||""); }
  else if(view==="lista"){ app.innerHTML=viewList(parts[1],parts.slice(2).join("/"),params); }
  else { location.hash="#/"; return; }
  const q = view==="busca" ? (params.get("q")||"") : "";
  lastQ=q;
  mountSearch($("topSearch"),{val:q,ph:"Buscar medicamento, sintoma…"});
  const hs=$("heroSearch"); if(hs) mountSearch(hs,{ph:"Digite seus sintomas ou o nome do remédio",hero:true,multi:true});
  if(view==="calculadora") initCalc(parts[1]||"",params);
  const ss=$("symSearch"); if(ss) mountSearch(ss,{ph:"Adicionar sintoma…",multi:true,live:true,chips:symNames(params),focus:!!params.get("f")});
}
window.addEventListener("hashchange",route);

/* ---------- busca com sugestões (e vários sintomas) ---------- */
function resolveSymptom(text,exact){
  const k=norm(text); if(!k) return null;
  if(PAT_MAP.has(k)) return PAT_MAP.get(k);
  if(exact) return null;
  const byCount=(a,b)=>b.prods.length-a.prods.length;
  const pre=PATS.filter(e=>e.k.startsWith(k)).sort(byCount);
  if(pre.length) return pre[0];
  const inc=PATS.filter(e=>e.k.includes(k)).sort(byCount);
  return inc[0]||null;
}
// "dor de cabeça e febre", "febre, tosse", "febre + coriza" -> lista de sintomas (ou null)
function splitSymptoms(q){
  const parts=q.split(/\s*(?:,|;|\+|\be\b)\s*/i).filter(Boolean);
  if(parts.length<2) return null;
  const out=[];
  for(const p of parts){ const r=resolveSymptom(p); if(!r) return null; if(!out.includes(r)) out.push(r); }
  return out;
}

function mountSearch(box,o){
  o=o||{};
  const multi=!!o.multi; let chips=[...(o.chips||[])];
  box.innerHTML=`<form class="sfield" role="search" autocomplete="off">${ICON.search}
    <input type="search" enterkeyhint="search" aria-label="Buscar" value="${esc(o.val||"")}">
    ${o.hero?'<button class="sgo" type="submit">Buscar</button>':''}</form><div class="sug"></div>`;
  const form=box.querySelector("form"), inp=box.querySelector("input"), sug=box.querySelector(".sug");
  let sel=-1, tm;
  const toSymptoms=()=>{ location.hash=chips.length?href("sintomas",{s:chips.join("|"),f:o.live?1:""}):"#/"; };
  const drawChips=()=>{
    form.querySelectorAll(".sc").forEach(x=>x.remove());
    chips.forEach(n=>{
      const s=document.createElement("span"); s.className="sc";
      s.innerHTML=esc(n)+'<button type="button" aria-label="Remover '+esc(n)+'">×</button>';
      s.querySelector("button").onclick=()=>{ chips=chips.filter(c=>norm(c)!==norm(n)); drawChips(); if(o.live) toSymptoms(); else inp.focus(); };
      form.insertBefore(s,inp);
    });
    inp.placeholder = chips.length ? "adicionar outro sintoma…" : (o.ph||"");
  };
  const addChip=n=>{
    if(!chips.some(c=>norm(c)===norm(n))) chips.push(n);
    inp.value=""; drawChips(); sug.classList.remove("open");
    if(o.live) toSymptoms(); else { inp.focus(); draw(); }
  };
  const submit=()=>{
    sug.classList.remove("open");
    let t=inp.value.trim();
    if(multi){
      const parts=t?splitSymptoms(t):null;
      if(parts){ parts.forEach(e=>{ if(!chips.some(c=>norm(c)===norm(e.nome))) chips.push(e.nome); }); t=""; }
      else if(t){ const r=resolveSymptom(t,!chips.length); if(r){ if(!chips.some(c=>norm(c)===norm(r.nome))) chips.push(r.nome); t=""; } }
      if(chips.length){ inp.value=""; toSymptoms(); inp.blur(); return; }
    }else if(t){
      const parts=splitSymptoms(t)||(resolveSymptom(t,true)?[resolveSymptom(t,true)]:null);
      if(parts){ location.hash=href("sintomas",{s:parts.map(e=>e.nome).join("|")}); inp.blur(); return; }
    }
    location.hash=href("busca",{q:t}); inp.blur();
  };
  form.onsubmit=e=>{
    e.preventDefault();
    const cur=sug.querySelector("a.sel");
    if(cur){ if(cur.dataset.sym!==undefined) addChip(cur.dataset.sym); else { sug.classList.remove("open"); location.hash=cur.getAttribute("href"); } }
    else submit();
  };
  const symA=(e,q)=>`<a href="#" data-sym="${esc(e.nome)}"><span>${hl(e.nome,q)}</span><small>${nf(e.prods.length)} prod.</small></a>`;
  function draw(){
    const q=inp.value.trim(); sel=-1;
    const chosen=new Set(chips.map(norm));
    let h="";
    if(multi && (chips.length || !q)){
      // modo "montar lista de sintomas": só sugere sintomas
      let T = q ? searchAgg(PATS,q) : topSymptoms(10);
      T=T.filter(e=>!chosen.has(e.k)).slice(0,q?8:10);
      if(!T.length){ sug.classList.remove("open"); return; }
      h=`<h6>${q?"Sintomas":"Sintomas comuns"}${chips.length?" — toque para somar":""}</h6>`+T.map(e=>symA(e,q)).join("");
    }else{
      if(norm(q).length<2){ sug.classList.remove("open"); return; }
      const P=searchProds(q,"",true).slice(0,5), S=searchAgg(SUBS,q).slice(0,3), L=searchAgg(LABS,q).slice(0,2), T=searchAgg(PATS,q).slice(0,4);
      const hP = P.length ? "<h6>Medicamentos</h6>"+P.map(p=>`<a href="${hMed(p)}"><span>${hl(p.nome,q)}</span><small>${esc(p.laboratorio)}</small></a>`).join("") : "";
      const hT = T.length ? "<h6>Sintomas / patologias</h6>"+T.map(e=>multi?symA(e,q):`<a href="${hList("patologia",e.nome)}"><span>${hl(e.nome,q)}</span><small>${nf(e.prods.length)} prod.</small></a>`).join("") : "";
      h += multi ? hT+hP : hP+hT;
      if(S.length) h+="<h6>Princípios ativos</h6>"+S.map(e=>`<a href="${hList("substancia",e.nome)}"><span>${hl(e.nome,q)}</span><small>${nf(e.prods.length)} prod.</small></a>`).join("");
      if(L.length) h+="<h6>Laboratórios</h6>"+L.map(e=>`<a href="${hList("laboratorio",e.nome)}"><span>${hl(e.nome,q)}</span><small>${nf(e.prods.length)} prod.</small></a>`).join("");
      h+=`<a class="all" href="${href("busca",{q})}">Ver todos os resultados para “${esc(q)}”</a>`;
    }
    sug.innerHTML=h; sug.classList.add("open");
  }
  inp.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(draw,100);});
  inp.addEventListener("focus",()=>{ if(multi||inp.value.trim().length>=2) draw(); });
  inp.addEventListener("keydown",e=>{
    if(e.key==="Backspace" && !inp.value && chips.length){ chips.pop(); drawChips(); if(o.live) toSymptoms(); return; }
    const items=[...sug.querySelectorAll("a")];
    if(e.key==="Escape"){ sug.classList.remove("open"); return; }
    if(!sug.classList.contains("open")||!items.length) return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      sel += e.key==="ArrowDown" ? 1 : -1;
      if(sel>=items.length) sel=-1; else if(sel<-1) sel=items.length-1;
      items.forEach((a,i)=>a.classList.toggle("sel",i===sel));
      if(items[sel]) items[sel].scrollIntoView({block:"nearest"});
    }
  });
  sug.addEventListener("click",e=>{
    const a=e.target.closest("a"); if(!a) return;
    if(a.dataset.sym!==undefined){ e.preventDefault(); addChip(a.dataset.sym); }
    else sug.classList.remove("open");
  });
  drawChips();
  if(o.focus) inp.focus();
}
document.addEventListener("click",e=>{ document.querySelectorAll(".sug.open").forEach(s=>{ if(!s.parentElement.contains(e.target)) s.classList.remove("open"); }); });

/* ---------- componentes ---------- */
function tagOf(p){ const [l,c]=TIPO[p.tipo||""]||TIPO[""]; return `<span class="tag ${c}">${l}</span>`; }
function prodItem(p,q){
  const sub=[p.laboratorio,p.pa].filter(Boolean).join(" · ");
  return `<a class="item" href="${hMed(p)}"><span class="ico">${ICON.pill}</span>
    <span class="tx"><div class="nm">${hl(p.nome,q)}</div><div class="sb">${hl(sub,q)}</div></span>
    ${p.tipo?tagOf(p):""}<span class="go">${ICON.chev}</span></a>`;
}
function aggItem(e,kind,q){
  const ic={substancia:ICON.flask,laboratorio:ICON.building,patologia:ICON.heart}[kind];
  return `<a class="item" href="${hList(kind,e.nome)}"><span class="ico">${ic}</span>
    <span class="tx"><div class="nm">${hl(e.nome,q)}</div><div class="sb">${nf(e.prods.length)} produto${e.prods.length===1?"":"s"}</div></span><span class="go">${ICON.chev}</span></a>`;
}
function pager(total,page,mk){
  const pages=Math.ceil(total/PAGE); if(pages<=1) return "";
  const set=new Set([1,pages,page,page-1,page+1,page-2,page+2].filter(n=>n>=1&&n<=pages));
  const arr=[...set].sort((a,b)=>a-b);
  let h='<nav class="pager" aria-label="Paginação">';
  h+= page>1?`<a href="${mk(page-1)}" aria-label="Anterior">‹</a>`:`<span class="dis">‹</span>`;
  let prev=0;
  arr.forEach(n=>{ if(n-prev>1) h+='<span class="dots">…</span>'; h+= n===page?`<span class="cur">${n}</span>`:`<a href="${mk(n)}">${n}</a>`; prev=n; });
  h+= page<pages?`<a href="${mk(page+1)}" aria-label="Próxima">›</a>`:`<span class="dis">›</span>`;
  return h+"</nav>";
}
function noteBox(){ return `<div class="note">⚕️ Material de <b>referência</b> — não substitui a bula nem a orientação de médico/farmacêutico.</div>`; }

/* ---------- views ---------- */
function topSymptoms(n){
  return [...PATS].sort((a,b)=>b.prods.length-a.prods.length).slice(0,n);
}
function viewHome(){
  return `<section class="hero">
      <h1>Consulta de medicamentos</h1>
      <p>Pesquise por medicamento ou some seus sintomas — ex.: <i>dor de cabeça</i> + <i>febre</i>.</p>
      <div class="sbox" id="heroSearch"></div>
      <a class="calcbtn" href="#/calculadora">🧮 Calculadora de dose <small>para profissionais</small></a>
      <div class="explore">Explorar:
        <a href="${href("busca",{aba:"produtos"})}">Produtos</a> ·
        <a href="${href("busca",{aba:"substancias"})}">Princípios ativos</a> ·
        <a href="${href("busca",{aba:"patologias"})}">Patologias</a> ·
        <a href="${href("busca",{aba:"laboratorios"})}">Laboratórios</a></div>
    </section>`;
}

const ABAS=[["todos","Todos"],["produtos","Produtos"],["substancias","Substâncias"],["patologias","Patologias"],["laboratorios","Laboratórios"]];
function viewSearch(params){
  const q=(params.get("q")||"").trim();
  let aba=params.get("aba")||"todos";
  if(!ABAS.some(a=>a[0]===aba)) aba="todos";
  if(!q && aba==="todos") aba="produtos";
  const tipo=params.get("tipo")||"";
  const page=Math.max(1,parseInt(params.get("p"))||1);
  const P=searchProds(q,aba==="produtos"?tipo:""), S=searchAgg(SUBS,q), L=searchAgg(LABS,q), T=searchAgg(PATS,q);
  const cnt={todos:P.length+S.length+L.length+T.length,produtos:P.length,substancias:S.length,patologias:T.length,laboratorios:L.length};
  if(aba==="produtos" && tipo){ cnt.produtos=searchProds(q).length; }
  document.title=(q?q+" — ":"")+"Resultados · BulaLivre";
  const tabs=`<div class="tabs" role="tablist">${ABAS.filter(a=>a[0]==="todos"?!!q:true).map(([k,l])=>
    `<a class="tab${k===aba?" on":""}" href="${href("busca",{q,aba:k==="todos"?"":k})}">${l}<i>${nf(cnt[k])}</i></a>`).join("")}</div>`;
  let body="";
  if(aba==="todos"){
    if(!cnt.todos) body=emptyMsg(q);
    else{
      const sec=(title,arr,aby,fn)=>arr.length?`<section class="sec"><h3>${title}<a href="${href("busca",{q,aba:aby})}">ver todos (${nf(arr.length)})</a></h3><div class="list">${arr.slice(0,5).map(fn).join("")}</div></section>`:"";
      body=sec("Produtos",P,"produtos",p=>prodItem(p,q))+sec("Princípios ativos",S,"substancias",e=>aggItem(e,"substancia",q))+
           sec("Patologias / sintomas",T,"patologias",e=>aggItem(e,"patologia",q))+sec("Laboratórios",L,"laboratorios",e=>aggItem(e,"laboratorio",q));
    }
  }else{
    const arr={produtos:P,substancias:S,patologias:T,laboratorios:L}[aba];
    const kind={substancias:"substancia",patologias:"patologia",laboratorios:"laboratorio"}[aba];
    const fn= aba==="produtos" ? (p=>prodItem(p,q)) : (e=>aggItem(e,kind,q));
    const filt = aba==="produtos" ? `<div class="filters"><span>Tipo:</span>${[["","Todos"],["mip","Isento de prescrição"],["presc","Sob prescrição"],["ctrl","Controlado"]].map(([v,l])=>
      `<a class="chip${tipo===v?" on":""}" href="${href("busca",{q,aba:"produtos",tipo:v})}">${l}</a>`).join("")}</div>` : "";
    body = filt + (arr.length ? `<div class="list">${arr.slice(PAGE*(page-1),PAGE*page).map(fn).join("")}</div>`+
      pager(arr.length,page,n=>href("busca",{q,aba,tipo,p:n})) : emptyMsg(q));
  }
  return `<div class="page"><h1 class="title">${q?`Resultados para “${esc(q)}”`:"Explorar"}</h1>
    <div class="sub">${q?"Medicamentos, princípios ativos, patologias e laboratórios.":"Navegue pela base completa."}</div>${tabs}${body}${noteBox()}</div>`;
}
function emptyMsg(q){
  return `<div class="empty">Nada encontrado${q?` para “<b>${esc(q)}</b>”`:""}.<br>Tente um sintoma (<i>febre</i>, <i>azia</i>, <i>cólica</i>), um remédio ou um laboratório.</div>`;
}

function viewList(kind,name,params){
  const map={substancia:SUB_MAP,laboratorio:LAB_MAP,patologia:PAT_MAP}[kind];
  const e=map&&map.get(norm(name));
  if(!e) return `<div class="page">${backBtn()}<div class="empty">Item não encontrado.<br><a href="#/">Voltar ao início</a></div></div>`;
  const page=Math.max(1,parseInt(params.get("p"))||1);
  const label={substancia:"Princípio ativo",laboratorio:"Laboratório",patologia:"Patologia / sintoma"}[kind];
  const list=[...e.prods].sort((a,b)=>a._n<b._n?-1:a._n>b._n?1:0);
  document.title=e.nome+" · BulaLivre";
  const rel = kind==="patologia" ? "" : "";
  return `<div class="page">${backBtn()}<div class="sub" style="margin:0">${label}</div>
    <h1 class="title">${esc(e.nome)}</h1><div class="sub">${nf(list.length)} produto${list.length===1?"":"s"}</div>

/* informação geral (uso, efeitos, cuidados) por princípio ativo */
function infoFor(p){
  const INFO=DATA.info||[]; const groups=[];
  p._subs.forEach(s=>{
    const ns=norm(s);
    const g=INFO.find(g=>g.chaves.some(c=>ns.includes(c)));
    if(!g) return;
    let e=groups.find(x=>x.g===g);
    if(!e){ e={g,subs:[]}; groups.push(e); }
    e.subs.push(cap(s));
  });
  return groups;
}
const ul=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;

function viewSintomas(params){
  const names=symNames(params);
  document.title=(names.length?names.join(" + ")+" — ":"")+"Sintomas · BulaLivre";
  const builder=`<div class="sbox symbox" id="symSearch"></div>`;
  if(!names.length) return `<div class="page"><h1 class="title">Buscar por sintomas</h1>
    <div class="sub">Adicione um ou mais sintomas para ver os medicamentos indicados.</div>${builder}${noteBox()}</div>`;
  const tipo=params.get("tipo")||"";
  const aba=params.get("aba")==="produtos"?"produtos":"substancias";
  const page=Math.max(1,parseInt(params.get("p"))||1);
  const ents=names.map(n=>PAT_MAP.get(norm(n)));
  const n=ents.length;
  const sets=ents.map(e=>new Set(e.prods));
  // produtos: quantos dos sintomas escolhidos cada um cobre
  const cnt=new Map();
  ents.forEach(e=>e.prods.forEach(p=>{ if(!tipo||p.tipo===tipo) cnt.set(p,(cnt.get(p)||0)+1); }));
  const byName=(a,b)=>a._n<b._n?-1:a._n>b._n?1:0;
  const prods=[...cnt].map(([p,c])=>({p,c})).sort((a,b)=>b.c-a.c||byName(a.p,b.p));
  // princípios ativos (só produtos de 1 substância, para a cobertura ser fiel)
  const subs=new Map();
  cnt.forEach((c,p)=>{
    if(p._subs.length!==1) return;
    const k=norm(p._subs[0]); let s=subs.get(k);
    if(!s){ s={e:SUB_MAP.get(k),c:0,np:0}; subs.set(k,s); }
    s.c=c; s.np++;
  });
  const sarr=[...subs.values()].filter(s=>s.e).sort((a,b)=>b.c-a.c||(b.np-a.np));
  const fullS=sarr.filter(s=>s.c===n).length, fullP=prods.filter(x=>x.c===n).length;
  const cntA={substancias:sarr.length,produtos:prods.length};
  const tab=(k,l)=>`<a class="tab${k===aba?" on":""}" href="${href("sintomas",{s:names.join("|"),aba:k==="substancias"?"":k,tipo})}">${l}<i>${nf(cntA[k])}</i></a>`;
  const filt=`<div class="filters"><span>Tipo:</span>${[["","Todos"],["mip","Isento de prescrição"],["presc","Sob prescrição"],["ctrl","Controlado"]].map(([v,l])=>
    `<a class="chip${tipo===v?" on":""}" href="${href("sintomas",{s:names.join("|"),aba:aba==="substancias"?"":aba,tipo:v})}">${l}</a>`).join("")}</div>`;
  const cov=(c)=>`<span class="cov${c===n?" full":""}" title="Cobre ${c} de ${n} sintomas">${c}/${n}</span>`;
  const arr = aba==="substancias" ? sarr : prods;
  const rows = arr.slice(PAGE*(page-1),PAGE*page).map(x=>{
    if(aba==="substancias"){
      const rep=x.e.prods.find(p=>p._subs.length===1);
      const g=rep?infoFor(rep)[0]:null;
      return `<a class="item" href="${hList("substancia",x.e.nome)}"><span class="ico">${ICON.flask}</span>
        <span class="tx"><div class="nm">${esc(x.e.nome)}</div><div class="sb">${g?esc(g.g.uso):nf(x.np)+" produto"+(x.np===1?"":"s")}</div></span>
        ${n>1?cov(x.c):""}<span class="go">${ICON.chev}</span></a>`;
    }
    return prodItem(x.p,"").replace('<span class="go">',(n>1?cov(x.c):"")+'<span class="go">');
  }).join("");
  let msg="";
  if(n>1){
    const full = aba==="substancias"?fullS:fullP;
    msg = full
      ? `<div class="sub"><b>${nf(full)}</b> ${aba==="substancias"?"princípio(s) ativo(s)":"produto(s)"} cobre(m) <b>todos os ${n} sintomas</b>; os demais cobrem parte deles.</div>`
      : `<div class="sub">Nenhum${aba==="substancias"?" princípio ativo":" produto"} cadastrado cobre todos os ${n} sintomas juntos — mostrando os que cobrem parte deles. Vários sintomas ao mesmo tempo podem pedir avaliação médica.</div>`;
  }else msg=`<div class="sub">${nf(cntA[aba])} ${aba==="substancias"?"princípios ativos":"produtos"} relacionados.</div>`;
  return `<div class="page"><h1 class="title">Medicamentos para ${esc(names.join(" + ").toLowerCase())}</h1>${builder}
    ${msg}<div class="tabs">${tab("substancias","Princípios ativos")}${tab("produtos","Produtos")}</div>${filt}
    ${arr.length?`<div class="list">${rows}</div>${pager(arr.length,page,p=>href("sintomas",{s:names.join("|"),aba:aba==="substancias"?"":aba,tipo,p}))}`:emptyMsg("")}
    ${noteBox()}</div>`;
}
function symNames(params){
  const out=[]; (params.get("s")||"").split("|").forEach(x=>{ const e=PAT_MAP.get(norm(x)); if(e&&!out.includes(e.nome)) out.push(e.nome); });
  return out;
}

/* CALC-ENGINE-START */
function numBR(v){ const n=parseFloat(String(v==null?"":v).replace(",",".")); return isFinite(n)?n:NaN; }
// Depuração do ClCr (Cockcroft-Gault), adultos
function crcl(idadeAnos,peso,crea,sexo){
  if(!(idadeAnos>=18)||!(peso>0)||!(crea>0)) return NaN;
  const v=((140-idadeAnos)*peso)/(72*crea);
  return sexo==="f"?v*0.85:v;
}
/* i: {grupo:"ped"|"ad", modo:"kg"|"fixa", dose, intervalo, dias, peso, idadeMeses, crcl,
       ap:{tipo:"gotas"|"susp"|"comp", conc, gotasPorMl, partir, pack}} */
function calcDose(d,i){
  const o={alertas:[],ok:false}; const A=(n,t)=>o.alertas.push({n,t});
  const ped=i.grupo==="ped", dosesDia=Math.round(24/i.intervalo), nativa=d.ped.modo;
  if(!(i.dose>0)){ o.erro="Informe a dose."; return o; }
  if(i.modo==="kg" && !(i.peso>0)){ o.erro="Informe o peso do paciente para calcular por mg/kg."; return o; }
  if(!i.ap || !(i.ap.conc>0)){ o.erro="Informe a concentração (mg/mL) ou a dosagem (mg) da apresentação."; return o; }
  if(i.ap.tipo==="gotas" && !(i.ap.gotasPorMl>0)){ o.erro="Informe quantas gotas equivalem a 1 mL."; return o; }
  if(!(i.dias>=1)){ o.erro="Informe a duração do tratamento (dias)."; return o; }
  const alvo = i.modo==="fixa" ? i.dose : (nativa==="dose" ? i.dose*i.peso : i.dose*i.peso/dosesDia);
  let qty, entregue, unidade;
  if(i.ap.tipo==="gotas"){
    qty=Math.max(1,Math.round(alvo/i.ap.conc*i.ap.gotasPorMl));
    entregue=qty/i.ap.gotasPorMl*i.ap.conc; unidade=qty===1?"gota":"gotas";
    o.ml=qty/i.ap.gotasPorMl;
  }else if(i.ap.tipo==="susp"){
    qty=Math.max(0.1,Math.round(alvo/i.ap.conc*10)/10);
    entregue=qty*i.ap.conc; unidade="mL"; o.ml=qty;
  }else{
    const step=i.ap.partir?0.5:1;
    qty=Math.max(step,Math.round(alvo/i.ap.conc/step)*step);
    entregue=qty*i.ap.conc; unidade=qty===1?"comprimido":"comprimidos";
  }
  const desvio=(entregue-alvo)/alvo*100;
  if(Math.abs(desvio)>10) A("aviso","O arredondamento prático altera a dose em "+(desvio>0?"+":"")+desvio.toFixed(0)+"% em relação ao alvo ("+alvo.toFixed(1)+" mg). Considere outra apresentação.");
  // faixa de referência da dose informada
  const fx = i.modo==="fixa" ? d.ad : d.ped;
  const uni = i.modo==="fixa" ? "mg por dose" : "mg/kg/"+(nativa==="dose"?"dose":"dia");
  if(i.dose<fx.min) A("aviso","Dose abaixo da faixa de referência ("+fx.min+"–"+fx.max+" "+uni+").");
  if(i.dose>fx.max) A("perigo","Dose acima da faixa de referência ("+fx.min+"–"+fx.max+" "+uni+").");
  // limites sobre o que de fato será administrado
  const dia=entregue*dosesDia;
  if(d.maxDoseMg && entregue>d.maxDoseMg+1e-9) A("perigo","Dose única de "+entregue.toFixed(0)+" mg acima do máximo de "+d.maxDoseMg+" mg.");
  if(d.maxDiaMg && dia>d.maxDiaMg+1e-9) A("perigo","Dose diária de "+dia.toFixed(0)+" mg acima do máximo de "+d.maxDiaMg+" mg/dia.");
  if(i.peso>0 && d.maxDiaMgKg){
    const kgDia=dia/i.peso;
    if(kgDia>d.maxDiaMgKg+1e-9) A("perigo","Dose diária de "+kgDia.toFixed(0)+" mg/kg acima do máximo de "+d.maxDiaMgKg+" mg/kg/dia.");
  }
  if(ped && entregue>d.ad.max+1e-9) A("aviso","Dose acima da dose máxima de adulto ("+d.ad.max+" mg por dose).");
  if(d.idadeMinMeses && i.idadeMeses>=0 && i.idadeMeses<d.idadeMinMeses) A("perigo","Paciente abaixo da idade mínima de uso indicada ("+d.idadeMinMeses+" meses). Confirme na bula.");
  if(i.idadeMeses>=0 && i.idadeMeses<1) A("aviso","Neonato: doses costumam ser específicas; confirme em fonte pediátrica.");
  if(d.intervaloMinH && i.intervalo<d.intervaloMinH) A("perigo","Intervalo menor que o mínimo usual ("+d.intervaloMinH+" h).");
  if(d.renal && i.crcl>=0 && i.crcl<60) A(i.crcl<30?"perigo":"aviso","Depuração de creatinina estimada em "+i.crcl.toFixed(0)+" mL/min: verifique ajuste de dose/intervalo na bula.");
  if(i.peso>0 && (i.peso<2||i.peso>250)) A("aviso","Peso informado incomum ("+i.peso+" kg). Confira o valor.");
  // totais
  const dosesTotal=dosesDia*i.dias; const totalQty=qty*dosesTotal;
  let totalTxt, emb=null;
  if(i.ap.tipo==="gotas"){ const tml=totalQty/i.ap.gotasPorMl; totalTxt=fmt(tml)+" mL ("+totalQty+" gotas)"; if(i.ap.pack>0) emb={n:Math.ceil(tml/i.ap.pack-1e-9),un:"frasco(s) de "+fmt(i.ap.pack)+" mL"}; }
  else if(i.ap.tipo==="susp"){ totalTxt=fmt(totalQty)+" mL"; if(i.ap.pack>0) emb={n:Math.ceil(totalQty/i.ap.pack-1e-9),un:"frasco(s) de "+fmt(i.ap.pack)+" mL"}; }
  else{ totalTxt=fmt(totalQty)+" comprimido(s)"; if(i.ap.pack>0) emb={n:Math.ceil(totalQty/i.ap.pack-1e-9),un:"caixa(s) de "+fmt(i.ap.pack)+" comprimidos"}; }
  Object.assign(o,{ok:true,alvo,qty,unidade,entregue,desvio,dosesDia,dosesTotal,dia,kgDia:i.peso>0?dia/i.peso:null,totalTxt,emb,nativa});
  return o;
}
function fmt(n){ return (Math.round(n*100)/100).toLocaleString("pt-BR",{maximumFractionDigits:2}); }

function cinHtml(id){
  const c=CIN[id]; if(!c) return "";

  const rows=[["Início de ação",c.inicio],["Pico",c.pico],["Duração do efeito",c.duracao],["Meia-vida",c.meiaVida],["Eliminação",c.eliminacao],["Alimentos",c.alimento]].filter(r=>r[1]&&r[1]!=="—");
  return dyn+`<h3 class="ph">Cinética — como o corpo trata</h3><dl class="cin">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl><div class="cuso">Valores aproximados para adultos saudáveis, via oral. Podem variar com idade, função renal/hepática e formulação.</div>`;

/* Medicamento sem dados de referência: o app só faz a conta */
const LIVRE={id:"livre",nome:"Outro medicamento (cálculo manual)",chaves:[],
  uso:"Sem dados de referência: o app apenas faz a conta com os valores informados.",
  ped:{modo:"dose",min:0,max:Infinity,padrao:""}, ad:{min:0,max:Infinity,padrao:""},
  int:{ped:[4,6,8,12,24],ad:[4,6,8,12,24],pedPad:8,adPad:8}, dias:5,

function doseFor(p){
  if(!p||p._subs.length!==1) return null;
  const s=norm(p._subs[0]);
  return DOSES.find(d=>d.chaves.some(c=>s.startsWith(c)))||null;
}

function initCalc(drugId,params){
  const g=id=>document.getElementById(id);
  const dsel=g("cDrug");
  const ALL=DOSES.concat([LIVRE]);
  dsel.innerHTML=ALL.map(d=>`<option value="${d.id}">${esc(d.nome)}</option>`).join("");
  g("cAvail").innerHTML=`Hoje o app tem <b>${DOSES.length} medicamentos com doses de referência, alertas, dinâmica e cinética</b>. Os dados da ANVISA (que alimentam a consulta) trazem nome, laboratório e princípio ativo, mas <b>não trazem dose, concentração, dinâmica nem cinética</b>. Por isso cada medicamento da calculadora foi cadastrado à mão e precisa ser revisado por um profissional antes de entrar — a lista cresce aos poucos.<br><br>Para <b>qualquer outro medicamento</b> escolha “Outro medicamento (cálculo manual)”: o app faz a conta e escolhe o produto/marca da base, mas <b>sem faixas, limites ou alertas de segurança</b>.`;
  const preP=params.get("p")?BY_ID.get(params.get("p")):null;
  const pre=ALL.find(d=>d.id===drugId)||doseFor(preP)||DOSES[0];
  dsel.value=pre.id;
  let drug=pre, dirty=false, curAp=null;
  document.title="Calculadora de dose · BulaLivre";

  const idadeMeses=()=>{ const v=numBR(g("cIdade").value); if(!(v>=0)) return -1; return g("cIdU").value==="a"?v*12:v; };
  const grupo=()=>{ const m=idadeMeses(), pw=numBR(g("cPeso").value); if(m>=0) return m<216?"ped":"ad"; return pw>0&&pw<40?"ped":"ad"; };
  const setOpts=(sel,list,val)=>{ sel.innerHTML=list.map(([v,l])=>`<option value="${v}">${l}</option>`).join(""); if(val!==undefined) sel.value=val; };

  function modeDefaults(){
    const m=g("cModo").value;
    g("cDose").value = String(m==="fixa"?drug.ad.padrao:drug.ped.padrao).replace(".",",");
    dirty=false; faixa();
  }
  function faixa(){
    const m=g("cModo").value, nat=drug.ped.modo==="dose"?"dose":"dia";
    if(drug===LIVRE){ g("cDoseLbl").textContent = m==="fixa"?"mg por dose":"mg/kg "+(m==="kgd"?"por dia":"por dose"); g("cFaixa").textContent="Sem faixa de referência: informe a dose prescrita."; return; }
    g("cDoseLbl").textContent = m==="kg" ? "mg/kg por "+nat : "mg por dose";
    g("cFaixa").textContent = "Faixa de referência: "+(m==="kg"? drug.ped.min+"–"+drug.ped.max+" mg/kg/"+nat+" (crianças)" : drug.ad.min+"–"+drug.ad.max+" mg por dose (adultos)")+".";
  }
  function intervals(){
    const gr=grupo(), list=drug.int[gr], keep=numBR(g("cInt").value);
    setOpts(g("cInt"),list.map(h=>[h,"a cada "+h+" h ("+Math.round(24/h)+"×/dia)"]), list.includes(keep)?keep:drug.int[gr+"Pad"]);
  }
  function loadDrug(){
    drug=ALL.find(d=>d.id===dsel.value);
    g("cUso").textContent=drug.uso;
    setOpts(g("cModo"), drug===LIVRE?[["kg","mg/kg por dose"],["kgd","mg/kg por dia"],["fixa","mg (fixa)"]]:[["kg","mg/kg"],["fixa","mg (fixa)"]], grupo()==="ped"?"kg":"fixa");
    g("cInt").innerHTML=""; intervals();
    g("cDias").value=drug.dias;
    setOpts(g("cAp"),drug.apres.map(a=>[a.id,esc(a.rot)]).concat([["_x","Outra apresentação…"]]),drug.apres.length?drug.apres[0].id:"_x");
    loadAp(); modeDefaults(); brandList();
  }
  function loadAp(){
    const a=drug.apres.find(x=>x.id===g("cAp").value);
    const custom=!a;
    if(a){ g("cTipo").value=a.tipo; g("cConc").value=String(a.conc).replace(".",","); g("cGotas").value=a.gotasPorMl||""; g("cPack").value=a.pack||""; }

  function tipoUI(){

    g("cPartirW").style.display = t==="comp"?"":"none";
  }
  function brandList(){
    const q=norm(g("cBrandQ").value), keep=g("cBrand").value;
    let L = drug===LIVRE
      ? (q.length>=2 ? PRODS.filter(p=>(p._n+" "+norm(p.laboratorio)+" "+norm(p.pa)).includes(q)) : [])
      : PRODS.filter(p=>p._subs.length===1 && drug.chaves.some(c=>norm(p._subs[0]).startsWith(c)) && (!q || (p._n+" "+norm(p.laboratorio)).includes(q)));
    L.sort((a,b)=>a._n<b._n?-1:a._n>b._n?1:0);
    const total=L.length; L=L.slice(0,80);
    if(preP && !q && !L.includes(preP) && doseFor(preP)===drug) L.unshift(preP);
    g("cBrand").innerHTML='<option value="">— não especificar —</option>'+L.map(p=>`<option value="${esc(p.id)}">${esc(p.nome)} — ${esc(p.laboratorio)}</option>`).join("")+(total>80?`<option disabled>… ${nf(total-80)} outros: refine a busca</option>`:"");
    if(keep && L.some(p=>p.id===keep)) g("cBrand").value=keep; else if(preP && !q && L.includes(preP) && !g("cBrand").dataset.touched) g("cBrand").value=preP.id;
    g("cBrandInfo").innerHTML = drug===LIVRE && !q ? "Digite o nome, princípio ativo ou laboratório para buscar qualquer produto da base." : (total? nf(total)+" produto(s) encontrado(s) na base." : "Nenhum produto encontrado.");
  }

  function read(){
    let modo=g("cModo").value;
    if(drug===LIVRE){ drug.ped.modo = modo==="kgd"?"dia":"dose"; if(modo==="kgd") modo="kg"; }
    return {
      grupo:grupo(), modo, dose:numBR(g("cDose").value), intervalo:numBR(g("cInt").value), dias:Math.round(numBR(g("cDias").value)),
      peso:numBR(g("cPeso").value), idadeMeses:idadeMeses(),
      ap:{tipo:g("cTipo").value, conc:numBR(g("cConc").value), gotasPorMl:numBR(g("cGotas").value), partir:g("cPartir").checked, pack:numBR(g("cPack").value)}
    };
  }
  function recalc(){
    const i=read();
    const idadeAnos=i.idadeMeses>=0?i.idadeMeses/12:NaN;
    const cc=crcl(idadeAnos,i.peso,numBR(g("cCrea").value),g("cSexo").value);
    g("cCrcl").textContent = isFinite(cc)?"Depuração de creatinina estimada (Cockcroft-Gault): "+cc.toFixed(0)+" mL/min.":"Informe idade (≥ 18 anos), peso, sexo e creatinina.";
    i.crcl=isFinite(cc)?cc:-1;
    const out=g("cOut"), r=calcDose(drug,i);
    if(!r.ok){ out.innerHTML=`<div class="rx empty-rx"><div class="rx-h">Resultado</div><p>${esc(r.erro)}</p></div>`; return; }
    const brandId=g("cBrand").value, bp=brandId?BY_ID.get(brandId):null;
    const apRot=drug.apres.find(x=>x.id===g("cAp").value)?.rot || (g("cTipo").value==="comp"?"comprimido ":"líquido ")+g("cConc").value.replace(".",",")+(g("cTipo").value==="comp"?" mg":" mg/mL");
    const grp=i.grupo==="ped"?"criança/adolescente":"adulto";
    const calcTxt = i.modo==="fixa" ? "dose fixa de "+fmt(i.dose)+" mg" : fmt(i.dose)+" mg/kg/"+(r.nativa==="dose"?"dose":"dia")+" × "+fmt(i.peso)+" kg";
    const posol = `Tomar ${fmt(r.qty)} ${r.unidade} (${fmt(r.entregue)} mg) por via oral a cada ${i.intervalo} horas (${r.dosesDia}×/dia), por ${i.dias} dia${i.dias===1?"":"s"}.`;
    const totalLn = `Total do tratamento: ${r.totalTxt}${r.emb?` → ${r.emb.n} ${r.emb.un}`:""}.`;
    const idt=g("cId").value.trim();
    const txt=[idt?"Paciente: "+idt:"", drug.nome+" — "+apRot+(bp?" ("+bp.nome+", "+bp.laboratorio+")":""), posol, totalLn, "Cálculo: "+calcTxt+" → dose-alvo "+fmt(r.alvo)+" mg.", "Calculado no BulaLivre — conferir antes de prescrever."].filter(Boolean).join("\n");
    const al=r.alertas.concat(drug.notas.map(t=>({n:"info",t})));
    const worst=r.alertas.some(a=>a.n==="perigo");
    const INF=(DATA.info||[]).find(gp=>gp.chaves.some(c=>drug.chaves.includes(c)));
    out.innerHTML=`<div class="rx${worst?" rx-bad":""}">
      <div class="rx-h">Prescrição calculada <small>${grp}</small></div>
      ${idt?`<div class="print-only rx-id">Paciente: ${esc(idt)}</div>`:""}
      <div class="rx-big">${fmt(r.qty)} <span>${r.unidade}</span></div>
      <div class="rx-line">a cada <b>${i.intervalo} h</b> (${r.dosesDia}×/dia) por <b>${i.dias} dia${i.dias===1?"":"s"}</b></div>
      <div class="rx-sub">${esc(drug.nome)} · ${esc(apRot)}${bp?`<br><a href="${hMed(bp)}">${esc(bp.nome)}</a> — ${esc(bp.laboratorio)}`:""}</div>
      <table class="rx-t">
        <tr><td>Dose-alvo</td><td>${fmt(r.alvo)} mg <small>(${esc(calcTxt)})</small></td></tr>
        <tr><td>Dose administrada</td><td>${fmt(r.entregue)} mg ${Math.abs(r.desvio)>0.5?`<small>(${r.desvio>0?"+":""}${r.desvio.toFixed(0)}% do alvo)</small>`:""}</td></tr>
        <tr><td>Dose diária</td><td>${fmt(r.dia)} mg${r.kgDia?` <small>(${fmt(r.kgDia)} mg/kg/dia)</small>`:""}</td></tr>
        <tr><td>Total</td><td>${esc(r.totalTxt)}${r.emb?`<br><b>${r.emb.n} ${esc(r.emb.un)}</b>`:""}</td></tr>
      </table>
      ${al.map(a=>`<div class="al al-${a.n}">${a.n==="perigo"?"⛔":a.n==="aviso"?"⚠️":"ℹ️"} ${esc(a.t)}</div>`).join("")}
      <button class="rx-mini noprint" id="cMini" type="button"><span>${fmt(r.qty)} ${r.unidade} · ${i.intervalo} h · ${i.dias} d</span><b>ver resultado ↓</b></button>
      <div class="rx-btns noprint"><button class="btn pri" id="cCopy">Copiar texto</button><button class="btn" id="cPrint">Imprimir</button></div>
      <div class="print-only rx-date">Emitido em ${new Date().toLocaleDateString("pt-BR")} · calculado no BulaLivre — conferir antes de prescrever.</div>
    </div>
    ${CIN[drug.id]?`<details class="opt noprint"><summary>Dinâmica e cinética (referência)</summary>${cinHtml(drug.id)}</details>`:""}
    ${INF?`<details class="opt noprint"><summary>Efeitos colaterais e cuidados (informação geral)</summary><div class="blk"><ul>${(INF.efeitos||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><ul>${(INF.cuidados||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details>`:""}
    <div class="alert info noprint">Ferramenta de <b>apoio ao cálculo</b>: não substitui o julgamento clínico. As doses de referência precisam ser validadas e a decisão e a conferência final são do prescritor.</div>`;
    g("cCopy").onclick=()=>{
      const done=()=>toast("Texto copiado");
      if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done,()=>fallback()); else fallback();
      function fallback(){ const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand("copy");done();}catch(e){toast("Não foi possível copiar");} t.remove(); }
    };
    g("cPrint").onclick=()=>window.print();
    g("cMini").onclick=()=>{ const r0=g("cOut").querySelector(".rx").getBoundingClientRect(); window.scrollTo({top:window.scrollY+r0.top-70,behavior:"smooth"}); };
  }

  dsel.onchange=()=>{ g("cBrandQ").value=""; delete g("cBrand").dataset.touched; loadDrug(); recalc(); };
  g("cModo").onchange=()=>{ modeDefaults(); recalc(); };
  g("cAp").onchange=()=>{ loadAp(); recalc(); };
  g("cTipo").onchange=()=>{ tipoUI(); recalc(); };
  g("cBrandQ").oninput=()=>{ brandList(); };
  g("cBrand").onchange=()=>{
    g("cBrand").dataset.touched=1;
    const bp=BY_ID.get(g("cBrand").value), dd=bp&&doseFor(bp);
    if(drug===LIVRE && dd) g("cBrandInfo").innerHTML=`Este princípio ativo tem dados de referência: escolha <b>${esc(dd.nome)}</b> na lista de medicamentos para ver faixas, alertas, dinâmica e cinética.`;
    recalc();
  };
  g("cDose").oninput=()=>{ dirty=true; recalc(); };
  const regroup=()=>{
    const gr=grupo(), cur=g("cModo").value;
    // troca a base padrão ao mudar de adulto/criança, se o usuário ainda não mexeu na dose
    if(!dirty){ g("cModo").value=gr==="ped"?"kg":"fixa"; if(g("cModo").value!==cur) modeDefaults(); }
    intervals(); recalc();
  };
  ["cIdade","cIdU","cPeso"].forEach(id=>{ g(id).oninput=regroup; g(id).onchange=regroup; });
  ["cInt","cDias","cConc","cGotas","cPack","cPartir","cSexo","cCrea","cId"].forEach(id=>{ g(id).oninput=recalc; g(id).onchange=recalc; });

  loadDrug(); recalc();
}

/* ---------- dados ---------- */
async function loadData(bustCache){
  if(OFFLINE){ DATA = EMBEDDED_DATA; afterLoad(); return; }
  try{
    const r = await fetch("bulas.json?v="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    DATA = await r.json();
    afterLoad();
    if(bustCache) toast("Base atualizada — versão "+(DATA.versao||"?")+" ("+nf(DATA.total||DATA.produtos.length)+" produtos)");
  }catch(e){
    $("app").innerHTML='<div class="empty">Não foi possível carregar <b>bulas.json</b> ('+esc(e.message)+').<br>'+
      'No GitHub Pages ele é gerado pelo workflow de atualização.</div>';
  }
}
function afterLoad(){
  buildIndex();
  DATA.total = DATA.total || PRODS.length;
  const d = DATA.atualizado_em ? new Date(DATA.atualizado_em) : null;
  const quando = d && !isNaN(d) ? d.toLocaleDateString("pt-BR") : (DATA.versao||"—");
  $("footer").innerHTML = "Fonte: "+esc(DATA.fonte||"ANVISA — Dados Abertos")+" · base de "+esc(quando)+
    (OFFLINE ? " · <b>cópia offline</b> (para atualizar, baixe de novo no site)" : "");
  if(OFFLINE) $("btnUpdate").style.display="none";
  route();
}

$("btnUpdate").onclick=()=>{ const b=$("btnUpdate"); b.disabled=true; loadData(true).finally(()=>{ b.disabled=false; }); };
$("btnDownload").onclick=downloadOffline;
async function downloadOffline(){
  const btn=$("btnDownload"); btn.disabled=true;
  try{
    let src;
    try{ src=await (await fetch("index.html",{cache:"no-store"})).text(); }
    catch(e){ src="<!DOCTYPE html>\n"+document.documentElement.outerHTML; }
    // remove índices calculados (campos com "_" e id) para o arquivo ficar enxuto
    const clean=JSON.stringify(DATA,(k,v)=>(k[0]==="_"||k==="id")?undefined:v).replace(/</g,"\\u003c");
    src=src.replace(/let EMBEDDED_DATA = [\s\S]*?; \/\*__EMBED_SLOT__\*\//, ()=>"let EMBEDDED_DATA = "+clean+"; /*__EMBED_SLOT__*/");
    const blob=new Blob([src],{type:"text/html"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="bulalivre-offline.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("Arquivo offline gerado — salve no celular/computador");
  }catch(e){ toast("Falha ao gerar o arquivo: "+e.message); }
  finally{ btn.disabled=false; }
}

let toastTmr;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTmr); toastTmr=setTimeout(()=>t.classList.remove("show"),3200); }

// Service worker: habilita uso offline após a 1ª visita (só em http/https).
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

loadData(false);
</script>
